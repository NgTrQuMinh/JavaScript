        // 2. Gửi dữ liệu đi (Request Body)
        // Quy tắc cấu hình dữ liệu gửi lên server bằng fetch():
        // Khi dùng POST, PUT, hoặc PATCH để gửi dữ liệu dạng Object, trong object cấu hình của fetch() bạn cần bắt buộc setup 2 yếu tố:
        // body: Dùng JSON.stringify() để chuyển Object thành chuỗi JSON.
        // headers: Thêm 'Content-Type': 'application/json' để server hiểu được định dạng dữ liệu. 

        const getPost = async () => {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                if (!response.ok) throw new Error(`Lỗi: ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(error);
            }
        }
        getPost();

        async function createPost({ title, body }) {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title,
                        body,
                    }),
                })
                if (!response.ok) throw new Error(`Lỗi: ${response.status}`);
                const data = await response.json();
                data.id = Date.now();   // Thêm id mới
                return data;
            } catch (error) {
                console.error(error);
            }
        }
        const handleApp = async () => {
            const getPosts = await getPost();
            console.log("Danh sách gốc lấy từ API:", getPosts);

            console.log("\n--- TIẾP THEO: TẠO BÀI VIẾT MỚI ---");
            const post1 = await createPost({ title: 'My Post', body: 'This is my Post' });
            console.log(post1);
            if (post1) getPosts.push(post1); // Gộp bài 1 vào danh sách gốc

            const post2 = await createPost({ title: 'My Post 2', body: 'This is my Post 2' });
            console.log(post2);
            if (post2) getPosts.push(post2); // Gộp bài 2 vào danh sách gốc

            console.log("\n--- KẾT QUẢ CUỐI CÙNG ---");
            console.log("Mảng tổng hợp cả cũ và mới:", getPosts);
        }
        handleApp();
    </script>
